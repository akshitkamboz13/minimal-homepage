<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Studio — Builder IDE</title>
    <link rel="stylesheet" href="css/settings/widget-studio.css">
</head>
<body>

    <!-- ══ Header ══════════════════════════════════════════════════════════════ -->
    <header class="studio-header">
        <div class="studio-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>Widget Studio</span>
        </div>
        <div class="studio-actions">
            <button type="button" id="btn-toggle-properties" class="studio-btn active" title="Toggle Properties Panel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
            </button>
            <button type="button" id="btn-export-pkg" class="studio-btn">Export .homewidget</button>
            <button type="button" id="btn-save-widget" class="studio-btn primary">Save Widget</button>
            <button type="button" id="btn-close-studio" class="studio-btn">Close</button>
        </div>
    </header>

    <!-- ══ Workspace ═══════════════════════════════════════════════════════════ -->
    <main class="studio-workspace">

        <!-- ── Properties Sidebar ────────────────────────────────────────────── -->
        <aside class="studio-sidebar" id="studio-sidebar">
            <div class="sidebar-title">Widget Properties</div>

            <div class="form-group">
                <label for="widget-name">Widget Name</label>
                <input type="text" id="widget-name" class="form-control"
                       placeholder="My Awesome Widget" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="widget-author">Author</label>
                    <input type="text" id="widget-author" class="form-control" placeholder="si4k">
                </div>
                <div class="form-group">
                    <label for="widget-version">Version</label>
                    <input type="text" id="widget-version" class="form-control"
                           value="1.0.0" placeholder="1.0.0">
                </div>
            </div>

            <div class="form-group">
                <label for="widget-desc">Description</label>
                <textarea id="widget-desc" class="form-control"
                          placeholder="Brief details about what this widget does…"></textarea>
            </div>

            <div class="form-group">
                <label for="widget-type">Widget Type</label>
                <select id="widget-type" class="form-control">
                    <option value="app">Window Application</option>
                    <option value="vertical">Vertical Panel Shortcut</option>
                    <option value="horizontal">Horizontal Panel Shortcut</option>
                    <option value="widget">Dashboard Layout Widget</option>
                    <option value="cli">CLI-based Extension (Terminal Shell)</option>
                    <option value="hybrid">GUI + CLI Hybrid Extension</option>
                </select>
            </div>

            <div class="form-group">
                <label for="widget-icon-svg">Icon (SVG markup or URL)</label>
                <textarea id="widget-icon-svg" class="form-control"
                          style="font-family: monospace; font-size: 0.78rem;"
                          placeholder="<svg>…</svg>"></textarea>
            </div>

            <!-- Permissions -->
            <div class="form-group">
                <label>Permissions</label>
                <div class="permissions-list">
                    <label class="perm-item">
                        <input type="checkbox" id="perm-fetch" checked>
                        <span>network (fetch)</span>
                    </label>
                    <label class="perm-item">
                        <input type="checkbox" id="perm-notifications">
                        <span>notifications</span>
                    </label>
                    <label class="perm-item">
                        <input type="checkbox" id="perm-clipboard">
                        <span>clipboard</span>
                    </label>
                    <label class="perm-item">
                        <input type="checkbox" id="perm-storage">
                        <span>storage</span>
                    </label>
                    <label class="perm-item">
                        <input type="checkbox" id="perm-popups">
                        <span>popups / links</span>
                    </label>
                </div>
            </div>

            <!-- Environment Variables -->
            <div class="form-group">
                <label for="widget-env">Environment Variables</label>
                <textarea id="widget-env" class="form-control"
                          style="font-family: monospace; font-size: 0.78rem; min-height: 64px;"
                          placeholder="API_KEY=your_key&#10;DEFAULT_CITY=Tokyo"></textarea>
            </div>

            <!-- Dimensions (app / widget types only) -->
            <div id="dimensions-group" class="app-only-fields active">
                <div class="sidebar-title" style="margin-top: 0.25rem;">Dimensions</div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="widget-def-w">Default W</label>
                        <input type="number" id="widget-def-w" class="form-control" value="400">
                    </div>
                    <div class="form-group">
                        <label for="widget-def-h">Default H</label>
                        <input type="number" id="widget-def-h" class="form-control" value="300">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="widget-min-w">Min W</label>
                        <input type="number" id="widget-min-w" class="form-control" value="200">
                    </div>
                    <div class="form-group">
                        <label for="widget-min-h">Min H</label>
                        <input type="number" id="widget-min-h" class="form-control" value="160">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="widget-max-w">Max W</label>
                        <input type="number" id="widget-max-w" class="form-control" value="800">
                    </div>
                    <div class="form-group">
                        <label for="widget-max-h">Max H</label>
                        <input type="number" id="widget-max-h" class="form-control" value="600">
                    </div>
                </div>
            </div>
        </aside>

        <!-- ── File Explorer ──────────────────────────────────────────────────── -->
        <aside class="studio-explorer" id="studio-explorer">
            <div class="explorer-header">
                <span class="explorer-title">EXPLORER</span>
                <div class="explorer-toolbar">
                    <button type="button" id="btn-new-file" class="explorer-btn" title="New File">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9"  y1="15" x2="15" y2="15"/>
                        </svg>
                    </button>
                    <button type="button" id="btn-new-folder" class="explorer-btn" title="New Folder">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9"  y1="14" x2="15" y2="14"/>
                        </svg>
                    </button>
                    <button type="button" id="btn-import-folder" class="explorer-btn" title="Import Folder from System">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Hidden input for folder import -->
            <input type="file" id="input-import-folder" webkitdirectory directory multiple style="display: none;">

            <!-- Project root row -->
            <div class="file-tree-project-row" id="file-tree-project-toggle">
                <span class="tree-arrow open" id="project-tree-arrow">▸</span>
                <svg class="folder-icon-svg" width="14" height="14" viewBox="0 0 24 24"
                     fill="currentColor" opacity="0.6">
                    <path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                </svg>
                <span class="project-name" id="project-name-display">widget</span>
            </div>

            <!-- File tree — populated by builder.js -->
            <div id="file-tree" class="file-tree"></div>
        </aside>

        <!-- ── Code Editor Area ───────────────────────────────────────────────── -->
        <section class="studio-editor-area">
            <!-- Open file tabs bar -->
            <div class="editor-tabs-bar" id="editor-tabs-bar"></div>
            <!-- Dynamic editor pane (split for index.html, single for others) -->
            <div class="editor-pane" id="editor-pane"></div>
        </section>

        <!-- ── Live Preview ───────────────────────────────────────────────────── -->
        <section class="studio-preview-area">
            <div class="preview-header">
                <span class="preview-title">Live Preview</span>
                <div style="display:flex;gap:8px;align-items:center;">
                    <select id="preview-theme-select"
                            style="padding:4px 8px;font-size:0.72rem;outline:none;border-radius:4px;
                                   background:#27272a;color:#e4e4e7;border:1px solid rgba(255,255,255,0.1);cursor:pointer;">
                        <option value="dark">Dark Theme</option>
                        <option value="light">Light Theme</option>
                    </select>
                    <button type="button" id="btn-refresh-preview" class="studio-btn"
                            style="padding:4px 12px;font-size:0.75rem;">Run Code</button>
                </div>
            </div>
            <div class="preview-body">
                <div class="preview-frame-wrapper">
                    <div class="preview-frame-header">
                        <div class="preview-dot red"></div>
                        <div class="preview-dot yellow"></div>
                        <div class="preview-dot green"></div>
                        <div class="preview-frame-title">sandbox://widget-preview</div>
                    </div>
                    <iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms" id="preview-iframe"
                            title="Widget Sandbox Preview"
                            style="background:transparent;"></iframe>
                </div>
            </div>
        </section>

    </main>

    <!-- ══ Right-click Context Menu ════════════════════════════════════════════ -->
    <nav id="file-ctx-menu" class="file-ctx-menu" role="menu" aria-label="File options">
        <button type="button" class="ctx-item" id="ctx-open">Open</button>
        <button type="button" class="ctx-item" id="ctx-rename">Rename</button>
        <button type="button" class="ctx-item ctx-danger" id="ctx-delete">Delete</button>
        <div class="ctx-separator"></div>
        <button type="button" class="ctx-item" id="ctx-new-file">New File Here</button>
        <button type="button" class="ctx-item" id="ctx-new-folder">New Folder Here</button>
        <button type="button" class="ctx-item" id="ctx-import-folder">Import Folder Here</button>
    </nav>

    <!-- ══ Alert Toast ══════════════════════════════════════════════════════════ -->
    <div id="studio-alert" class="studio-alert">Action successful!</div>

    <script type="module" src="js/widget-studio/builder/index.js"></script>
</body>
</html>
